[project]
name = "troupe"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Developer", email = "developer@troupe.run" }
]
requires-python = ">=3.12"
dependencies = [
    "eventsourcing>=9.5.5",
    "jsonschema>=4.23",
    "ruamel-yaml>=0.19.1",
]

[project.scripts]
troupe = "troupe:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
